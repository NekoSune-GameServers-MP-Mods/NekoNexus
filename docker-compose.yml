# Full NekoNexus stack: MySQL + Bun web services + free LiteNetLib realtime (Comm + Game).
# No Photon SDK, no licence, no CCU cap. Multi-arch (amd64 + arm64) — see docker/README.md.
#
# Quick start (uses the prebuilt images published to GHCR — no source/build needed):
#   docker compose pull
#   docker compose up -d
#   # then seed the DB ONCE with the IP players will use to reach this host:
#   PARADISE_PUBLIC_HOST=<your-LAN-or-public-IP> docker compose run --rm seed
#
# PARADISE_PUBLIC_HOST is written into the in-game server list — it MUST be an address the
# player's machine can reach (your LAN IP like 192.168.x.x, your public IP, or a domain).
# 127.0.0.1 only works if the game runs on this same host. Change it later in the admin UI.
#
# To BUILD from source instead of pulling, comment out the `image:` line on a service and
# uncomment its `build:` block (you'll need the Core submodule: git submodule update --init packages/Core).
#
# Client connects to (open/forward these on the host):
#   8080 TCP (web), 8081 TCP (files), 5055 UDP (Comm), 5155 UDP (Game).
#   8082 is realtime<->master only — internal to the compose network, NOT needed by clients.

name: nekonexus

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: nekonexus
      MARIADB_USER: nekonexus
      MARIADB_PASSWORD: nekonexus
      MARIADB_ROOT_PASSWORD: nekonexus-root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot DB initializer. Run ONCE after the first `up` — it DROPS + recreates all tables
  # and seeds defaults (app config, shop, maps, the realtime server list, admin user):
  #   PARADISE_PUBLIC_HOST=192.168.1.50 docker compose run --rm seed
  # It does NOT start with `docker compose up` (it's behind the "tools" profile).
  seed:
    image: ghcr.io/nekosune-gameservers-mp-mods/nekonexus-webservices:latest
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The address PLAYERS use to reach the realtime servers (goes into the server list).
      PARADISE_PUBLIC_HOST: ${PARADISE_PUBLIC_HOST:-127.0.0.1}
    volumes:
      - ./docker/config/NekoNexus.Settings.WebServices.yml:/app/packages/ws/NekoNexus.Settings.WebServices.yml:ro
    command: ["bun", "src/index.ts", "seed"]

  webservices:
    image: ghcr.io/nekosune-gameservers-mp-mods/nekonexus-webservices:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: docker/webservices.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"   # SOAP web service
      - "8081:8081"   # file server
      - "8082:8082"   # realtime <-> master socket
    environment:
      # Shared secret for the admin -> ws internal realtime-notify endpoint (System-mail
      # broadcasts refresh online inboxes instantly). MUST match the admin service's value below.
      INTERNAL_API_KEY: "change-me-nekonexus-internal"
      # Optional: Android 4.3.10 item bundle copied from a user's own APK.
      NEKONEXUS_ANDROID_CONTENT_DIR: /data/android-content
    volumes:
      - ./docker/config/NekoNexus.Settings.WebServices.yml:/app/packages/ws/NekoNexus.Settings.WebServices.yml:ro
      # Client auto-updates: publish with misc/publish-update.ps1 (writes ./server-data/updates);
      # the file server serves them at /updates/v2/<channel>/. No image rebuild/restart needed.
      - ./server-data/updates:/app/packages/ws/wwwroot/updates:ro
      # User-provided Android item bundle; keep the 25 MB game asset out of the repository.
      - ./server-data/android-content:/data/android-content:ro

  realtime-comm:
    image: ghcr.io/nekosune-gameservers-mp-mods/nekonexus-realtime:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: docker/realtime.Dockerfile
    restart: unless-stopped
    depends_on:
      - webservices
    # The image ships a ready-to-run config; --master-host points it at the webservices
    # container. Add flags, e.g. ["Comm", "--master-host", "webservices", "--max-peers", "200"].
    command: ["Comm", "--master-host", "webservices"]
    ports:
      - "5055:5055/udp"

  realtime-game:
    image: ghcr.io/nekosune-gameservers-mp-mods/nekonexus-realtime:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: docker/realtime.Dockerfile
    restart: unless-stopped
    depends_on:
      - webservices
    environment:
      NEKONEXUS_BOT_MAP_DATA: /data/bot-maps
    command: ["Game", "--master-host", "webservices"]
    ports:
      - "5155:5155/udp"
    volumes:
      - ./server-data/bot-maps:/data/bot-maps

  # Admin dashboard (server/player/store management). Open http://<host>:8088 — default
  # login admin/admin; change it on the Account page on first run.
  admin:
    image: ghcr.io/nekosune-gameservers-mp-mods/nekonexus-admin:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: docker/admin.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMIN_PORT: "8088"
      # Share the stack's DB (same creds as the db service above).
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: nekonexus
      DB_PASS: nekonexus
      DB_NAME: nekonexus
      # CHANGE THIS — keeps admin login tokens valid across restarts and unguessable.
      ADMIN_JWT_SECRET: "change-me-nekonexus-admin"
      # Realtime System-mail broadcasts: must match webservices' INTERNAL_API_KEY above.
      # The web service is reached on the shared docker network as http://webservices:8080.
      INTERNAL_API_KEY: "change-me-nekonexus-internal"
      WS_INTERNAL_URL: "http://webservices:8080"
      # Public site URL (used for Steam sign-in return + absolute links). Set to your real domain.
      PUBLIC_BASE_URL: "${PARADISE_SITE_URL:-http://localhost:8088}"
      # Event theme for the public site: none | halloween | xmas | pride | easter | auto.
      SITE_THEME: "${SITE_THEME:-auto}"
      # Optional: Steam Web API key (only to resolve Steam display names; sign-in works without it).
      STEAM_API_KEY: "${STEAM_API_KEY:-}"
      # Optional: Twitch app credentials to power the /streams "now streaming UberStrike" page.
      TWITCH_CLIENT_ID: "${TWITCH_CLIENT_ID:-}"
      TWITCH_CLIENT_SECRET: "${TWITCH_CLIENT_SECRET:-}"
      # For NekoPay webhooks, set your public URL here (or in docker/.nekopay.env):
      # PUBLIC_BASE_URL: https://admin.yourdomain.com
    # NekoPay secret (optional). Create docker/.nekopay.env from docker/.nekopay.env.example.
    env_file:
      - path: ./docker/.nekopay.env
        required: false
    ports:
      - "8088:8088"

volumes:
  db-data:
