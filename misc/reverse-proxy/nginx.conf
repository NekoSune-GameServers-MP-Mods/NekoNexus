# NekoNexus behind one domain with nginx (Caddy alternative - see Caddyfile for the client URLs).
# Replace nekonexus.example.com and the certificate paths. Realtime game servers (UDP 5055/5155)
# are not proxied: clients get their IP from the server list. Keep the master socket (8082) internal.

upstream nekonexus_ws    { server 127.0.0.1:8080; }   # web service (SOAP)
upstream nekonexus_files { server 127.0.0.1:8081; }   # file server
upstream nekonexus_admin { server 127.0.0.1:8088; }   # website + admin panel

server {
    listen 443 ssl;
    http2 on;
    server_name nekonexus.example.com;

    ssl_certificate     /etc/ssl/nekonexus/fullchain.pem;
    ssl_certificate_key /etc/ssl/nekonexus/privkey.pem;

    client_max_body_size 50m;   # SOAP bodies / icon payloads can be large
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SOAP web services: the version prefix is part of the route, keep it (no trailing path on proxy_pass).
    location /2.0/   { proxy_pass http://nekonexus_ws; }
    location /1.0.2/ { proxy_pass http://nekonexus_ws; }   # Android 4.3.10

    # File server: PC images + auto-updates, Android items / maps / images.
    location /UberStrike/      { proxy_pass http://nekonexus_files; }
    location /images/          { proxy_pass http://nekonexus_files; }
    location /updates/         { proxy_pass http://nekonexus_files; }
    location = /crossdomain.xml { proxy_pass http://nekonexus_files; }

    # Website, player pages, store and the admin panel (/admin and its /api) - served as-is.
    location / { proxy_pass http://nekonexus_admin; }
}

server {
    listen 80;
    server_name nekonexus.example.com;
    return 301 https://$host$request_uri;
}
